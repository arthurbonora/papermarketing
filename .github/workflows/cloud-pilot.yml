name: Cloud pilot

on:
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-pilot.yml'
  push:
    branches: [master]
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-pilot.yml'

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cloud/core.test.mjs cloud/portal.test.mjs
      - run: node --check cloud/worker.mjs
      - run: bash -n cloud/install.sh cloud/backup.sh cloud/backup-all.sh
