name: papermarketing qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and test Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: papermarketing-qualification
      PAPERMARKETING_TEST_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17f519eb348f793721c85c67fe06cf5cdc72b38b
          persist-credentials: false
      - name: Verify the master source revision
        run: test "$(git rev-parse HEAD)" = "17f519eb348f793721c85c67fe06cf5cdc72b38b"
      - name: Record disposable runner capacity
        run: df -h /var/lib/docker
      - uses: docker/setup-buildx-action@v4
      - name: Build self-hosted image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          push: false
          tags: papermarketing:local
          build-args: PAPERCLIP_BUILD_COMMIT=17f519eb348f793721c85c67fe06cf5cdc72b38b
          cache-from: type=gha,scope=papermarketing-production
          cache-to: type=gha,scope=papermarketing-production,mode=min,ignore-error=true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Boot disposable authenticated stack
        run: |
          node docker/papermarketing/init-env.mjs
          docker compose --env-file docker/papermarketing/.env -f docker/papermarketing/compose.yaml up -d --no-build --wait --wait-timeout 240
      - name: Exercise boot, authentication boundary and persistence
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git show FETCH_HEAD:scripts/papermarketing/image-smoke.mjs > scripts/papermarketing/image-smoke.mjs
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/papermarketing/image-smoke.mjs
      - name: Remove only this test stack and its test volumes
        if: always()
        run: |
          if [ -f docker/papermarketing/.env ]; then
            docker compose --env-file docker/papermarketing/.env -f docker/papermarketing/compose.yaml down --volumes --remove-orphans
          fi
